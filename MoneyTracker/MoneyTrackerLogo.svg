<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Money Tracker">
  <title>Money Tracker</title>
  <!-- the ledger: periods recorded, shortest to longest -->
  <path d="M11 55V40" fill="none" stroke="#14B8A6" stroke-width="9" stroke-linecap="round"/>
  <path d="M32 55V33" fill="none" stroke="#14B8A6" stroke-width="9" stroke-linecap="round"/>
  <path d="M53 55V20" fill="none" stroke="#14B8A6" stroke-width="9" stroke-linecap="round"/>
  <!-- the flow: money in, money out, money moved -->
  <path d="M9 28 26 15 40 23 55 8"
        fill="none" stroke="#CCFBF1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
